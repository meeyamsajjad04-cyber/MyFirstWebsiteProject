 <!DOCTYPE html>
<html>
<head>
    <title>Task 3</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<table>
    <tr>
        <td colspan="2">
            <h2>Continental Hotel Reservation Form</h2>
        </td>
    </tr>

    <tr>
        <td class="heading">Name</td>
        <td><input type="text" placeholder="Enter your name"></td>
    </tr>

    <tr>
        <td class="heading">eMail</td>
        <td><input type="text" value="info@continental.pk"></td>
    </tr>

    <tr>
        <td class="heading">Mobile No</td>
        <td><input type="text" placeholder="Enter your cell number"></td>
    </tr>

    <tr>
        <td class="heading">Arrival Time</td>
        <td><input type="text" placeholder="Enter your arrival time"></td>
    </tr>

    <tr>
        <td class="heading">Departure</td>
        <td>
            <input type="text" size="15">
            <input type="text" size="15">
        </td>
    </tr>

    <tr>
        <td class="heading">Room Type</td>
        <td class="options">
            <input type="radio" name="room">Single
            <input type="radio" name="room">Double
            <br>
            <input type="radio" name="room">Presidential Suite
        </td>
    </tr>

    <tr>
        <td class="heading">Preferences</td>
        <td class="options">
            <input type="checkbox">Non-Smoking<br>
            <input type="checkbox">Internet<br>
            <input type="checkbox">Firm Mattress
        </td>
    </tr>

    <tr>
        <td class="heading">Mode of Payment</td>
        <td class="options">
            <input type="checkbox">Cash
            <input type="checkbox">Check
            <br>
            <input type="checkbox">Credit Card

            <select>
                <option>Select Card</option>
                <option>Visa</option>
                <option>Mastercard</option>
            </select>
        </td>
    </tr>

    <tr>
        <td colspan="2" class="button">
            <input type="submit" value="Send Data">
        </td>
    </tr>
</table>

</body>
</html>
